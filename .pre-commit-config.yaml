default_install_hook_types:
  - pre-commit
  - commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages:
          - commit-msg
        args:
          - --strict
          - --verbose

  - repo: local
    hooks:
      - id: mage-check
        name: mage check
        # fmt, vet, golangci-lint (pulled as a go.sum-pinned tool dep, no
        # ambient binary needed), then the test suite -- see magefiles/.
        entry: go run -C magefiles mage.go -w .. check
        language: system
        files: \.go$
        pass_filenames: false


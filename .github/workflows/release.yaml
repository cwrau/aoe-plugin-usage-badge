name: Release

# Tag vX.Y.Z to publish a GitHub Release with a source archive and its sha256.
# Agent of Empires can install the plugin from the archive (or from source).

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run -C magefiles mage.go -w .. check

      - name: Build source archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NAME=usage-badge-${TAG}
          git archive --format=tar.gz --prefix="${NAME}/" -o "${NAME}.tar.gz" HEAD
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          NAME=usage-badge-${TAG}
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            "${NAME}.tar.gz" "${NAME}.tar.gz.sha256"
